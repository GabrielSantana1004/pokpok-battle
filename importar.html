<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Importar Pokémon — PokPok Battle</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="visual.css">
    <link rel="stylesheet" href="telas.css">
    <link rel="stylesheet" href="tema.css">
</head>

<body>
    <!-- Página descartável: quando terminar de cadastrar, pode apagar importar.html e importar.js; nada mais depende deles. -->
    <header class="topo"><img src="Poké_Ball_icon.svg.webp" alt=""><h1>PokPok Battle</h1></header>
    <h3 class="titulo-pagina">Importar Pokémon (descartável)</h3>
    <nav id="nav"></nav>
    <section>
        <p>Digite os nomes em inglês (um por linha ou separados por vírgula). Para cada um, a PokéAPI fornece tipos, atributos e a lista completa de golpes que ele pode aprender (todas as gerações), e o Pokémon é cadastrado no catálogo.</p>
        <textarea id="nomes" rows="6" style="width:100%" placeholder="Absol&#10;Garchomp&#10;Mr. Mime"></textarea>
        <label><input type="checkbox" id="atualizar"> Atualizar também os Pokémon que já existem no catálogo</label>
        <p><button id="go" class="primario">Importar</button></p>
        <pre id="log"></pre>
    </section>
    <script type="module" src="importar.js"></script>
</body>

</html>
